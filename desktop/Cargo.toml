[package]
name = "dancing-grandpa-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop version of Dancing Grandpa application"
license = "MIT"

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_color",
    "png",
    "vorbis",
    "wav",
    "dynamic_linking",
] }
dancing-grandpa-common = { path = "../common" }

[target.'cfg(target_os = "windows")'.dependencies.bevy]
version = "0.16"
default-features = false
features = [
    "dynamic_linking",
]

[target.'cfg(not(target_os = "windows"))'.dependencies.bevy]
version = "0.16"
default-features = false
features = [
    "x11",
    "wayland",
]
