[package]
name = "dancing-grandpa-common"
version = "0.1.0"
edition = "2021"
description = "Common code for Dancing Grandpa application"
license = "MIT"

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_color",
    "png",
    "vorbis",
    "wav",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taffy = "0.8"
rand = "0.8"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.7", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bevy]
version = "0.16"
default-features = false
features = [
    "x11",
    "wayland",
]

