[package]
name = "dancing-grandpa-website"
version = "0.1.0"
edition = "2021"
description = "Web version of Dancing Grandpa application"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_color",
    "png",
    "vorbis",
    "wav",
    "webgl2",
] }
dancing-grandpa-common = { path = "../common" }
taffy = "0.8"
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.7", features = ["js"] }
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Document", "Window", "Element"] }
console_error_panic_hook = "0.1.7"
