<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Grandpa - Baby Entertainment System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            background: #000;
        }
        
        #bevy {
            width: 100%;
            height: 100vh;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2em;
            text-align: center;
            z-index: 1000;
        }
        
        .loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <h1>🕺 Dancing Grandpa 🕺</h1>
        <p>Loading...</p>
    </div>
    <canvas id="bevy"></canvas>
    
    <script type="module">
        // Wait for trunk to load the WASM module
        window.addEventListener('TrunkApplicationStarted', async (event) => {
            try {
                document.getElementById('loading').classList.add('hidden');
                // Call the run function from the WASM bindings
                if (window.wasmBindings && window.wasmBindings.run) {
                    window.wasmBindings.run();
                }
            } catch (error) {
                console.error('Failed to start application:', error);
                document.getElementById('loading').innerHTML = `
                    <h1>🕺 Dancing Grandpa 🕺</h1>
                    <p>Failed to start the application.</p>
                    <p>Error: ${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
